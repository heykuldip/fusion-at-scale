[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-at-scale"
version = "1.0.0"
description = "Distributed training, data and inference checks for synchronized video and wearable-sensor data"
readme = "README.md"
license = {text = "GPL-3.0-only"}
authors = [{name = "Kuldip Singh Atwal"}]
requires-python = ">=3.10"
dependencies = ["numpy", "torch"]

[project.optional-dependencies]
video = ["av"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
